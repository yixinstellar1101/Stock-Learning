  <script>const COURSE = {"lessons":[{"id":1,"short":"认识期权","title":"先理解权利，再谈收益","stage":"建立概念","minutes":20,"tag":"零基础","goal":"讲清 Call / Put、买方 / 卖方，以及 100 股乘数。","refs":[1,4,8],"body":"\n <p class=\"lead\">期权是一份有期限的合约。买方支付权利金，获得按约定价格买入或卖出标的的权利；卖方收到权利金，承担被行权时履约的义务。</p>\n <h2>01 / 用一张合约理解四个角色</h2><p>假设虚构股票 DEMO 现价 $100。花每股 $5 买一张行权价 $100 的 Call，标准、未调整合约通常对应 100 股，因此支出 $500 加费用。买到的是合约权利，并没有立刻买到股票。</p>\n <div class=\"table-wrap\"><table><thead><tr><th>头寸</th><th>权利 / 义务</th><th>风险</th></tr></thead><tbody><tr><td>买入 Call · 认购</td><td>有权按行权价买入股票</td><td>权利金可能全损</td></tr><tr><td>买入 Put · 认沽</td><td>有权按行权价卖出股票</td><td>权利金可能全损</td></tr><tr><td>卖出 Call</td><td>被指派时有义务交付股票</td><td>无备兑时理论损失无限</td></tr><tr><td>卖出 Put</td><td>被指派时有义务买入股票</td><td>大跌时损失可能很大</td></tr></tbody></table></div>\n <div class=\"callout\"><strong>“看涨”不等于“肯定赚钱”</strong><p>买入 $100 Call 并支付 $5，到期股价 $103 时，合约有 $3 内在价值，但每股仍净亏 $2。方向、幅度、时间和买入价格共同决定结果。</p></div>\n <h2>02 / 六个必须认识的词</h2><div class=\"term-grid\"><div><b>Underlying · 标的</b><p>对应的股票或 ETF。</p></div><div><b>Strike · 行权价</b><p>履约时约定的股票交易价格。</p></div><div><b>Expiration · 到期日</b><p>合约权利终止的具体日期。</p></div><div><b>Premium · 权利金</b><p>期权本身价格，通常按每股报价。</p></div><div><b>Multiplier · 乘数</b><p>标准股票期权通常为 100；调整合约另查交付物。</p></div><div><b>Exercise / Assignment</b><p>买方行权 / 卖方收到履约指派。</p></div></div>\n <h2>03 / 人们为什么用期权？</h2><p>持股者可购买 Put，为限定时间的下跌买保护；也可卖出备兑 Call，以放弃部分上涨空间换取权利金。方向交易者可用 Call / Put 表达观点，但有限成本仍可能发生 100% 损失。</p><p>未行权的期权通常没有股东投票权，也不直接获得股票分红。权利金不是存款、利息或保证收益。</p>\n <div class=\"exercise\"><span>动手练习</span><p>将“1 张、报价 $2.40、乘数 100”换算成实际支出，再加入券商每张每边的费用。用一句话解释 Call 卖方被指派要交付什么。</p></div>","quiz":[{"q":"一张标准股票 Call 报价 $2.40，忽略费用，买入需多少权利金？","options":["$2.40","$24","$240"],"answer":2,"explain":"$2.40 × 100 = $240。调整合约需要核查乘数和交付物。"},{"q":"没有股票而卖出一张 Call，最大的潜在风险是什么？","options":["最多损失收到的权利金","股价无限上涨时，理论损失无限","只会失去投票权"],"answer":1,"explain":"被指派时必须交股；没有股票就需获取股票，股价没有理论上限。"}]},{"id":2,"short":"读懂美股合约","title":"读懂期权链上的每一列","stage":"建立概念","minutes":25,"tag":"美股规则","goal":"区分股票、ETF、指数期权，读懂报价与开平仓。","refs":[1,4,5,6],"body":"\n <p class=\"lead\">相同股票、不同到期日、不同 Strike、Call 或 Put，都是不同合约。先确认产品和规则，再看方向。</p>\n <h2>01 / 先看产品</h2><div class=\"table-wrap\"><table><thead><tr><th>产品</th><th>典型规则</th><th>应核查</th></tr></thead><tbody><tr><td>美国股票期权</td><td>通常美式；实物交割股票</td><td>提前指派、公司行动、除息日</td></tr><tr><td>美国 ETF 期权</td><td>通常美式；实物交割份额</td><td>ETF 分配、流动性、持仓构成</td></tr><tr><td>部分指数期权，如 SPX</td><td>欧式；现金结算</td><td>AM / PM 结算、具体系列与最后交易时间</td></tr></tbody></table></div><p>美式允许到期前依规则行权；欧式限制在规定的到期行权窗口。两者均可在允许的交易时段平仓。“欧式”不表示在欧洲交易。SPY ETF 期权与 SPX 指数期权规则不同。</p>\n <h2>02 / 一行报价怎样读？</h2><div class=\"example-strip\"><span>DEMO · 假想到期日</span><strong>$100 Call</strong><span>Bid $4.80 / Ask $5.00</span></div><p><b>Bid</b> 是市场买价，<b>Ask</b> 是卖价。立即买入通常接近 Ask，立即卖出通常接近 Bid。Mid $4.90 只是中点，限价单未必成交。Last 是上笔成交价，可能已经过时。</p><p><b>Volume</b> 是当日成交张数；<b>Open Interest（OI）</b> 是尚未平仓合约量，通常按前一日清算更新。它们不直接表示看多人数、净流入或真实可成交深度。</p>\n <h2>03 / 开仓和平仓</h2><div class=\"term-grid\"><div><b>BTO · Buy to Open</b><p>买入开仓，建立期权多头。</p></div><div><b>STC · Sell to Close</b><p>卖出平仓，退出买入的合约。</p></div><div><b>STO · Sell to Open</b><p>卖出开仓，建立空头义务。</p></div><div><b>BTC · Buy to Close</b><p>买入平仓，退出空头义务。</p></div></div>\n <h2>04 / 到期日不能凭习惯猜</h2><p>标准月度股票期权通常在第三个星期五到期，另有周度、季度及其他安排。以具体合约为准，核查最后交易时间、结算与券商行权截止时间。交易时段按美东时间理解，留意夏令时。</p><p>实值到期合约通常依清算流程触发行权，但例外指令、资金与券商处理都可能改变结果。不能把“到期”当作不会发生股票交付的保证。拆股、并购还可能产生非标准交付物。</p><div class=\"exercise\"><span>动手练习</span><p>在券商模拟账户找到一张合约，记录标的、方向、到期日、Strike、乘数、Bid / Ask 和交割方式，先不下单。</p></div>","quiz":[{"q":"之前买入一张 Call，现在完全退出合约，通常选哪个指令？","options":["Sell to Close（STC）","Sell to Open（STO）","Buy to Open（BTO）"],"answer":0,"explain":"卖出平仓退出多头；卖出开仓会建立新的空头义务。"},{"q":"美式与欧式期权主要区别是什么？","options":["能否在到期前按规则行权","能否在到期前平仓","是否使用美元"],"answer":0,"explain":"区别是行权时点。欧式合约同样可在允许的交易时段平仓。"}]},{"id":3,"short":"盈亏与仓位方向","title":"画出盈亏，才算理解头寸","stage":"理解定价","minutes":25,"tag":"交互图解","goal":"算清四种基础头寸的到期盈亏、平衡点与风险边界。","refs":[1,4,9],"tool":"payoff","body":"\n <p class=\"lead\">先从到期盈亏学起：此时时间价值归零，计算最直接。到期前的价格留给下一课。</p><h2>01 / 四个公式，一条主线</h2><p>到期股价为 S_T、行权价 K、每股权利金 p、乘数 M、张数 n、总费用 F。</p><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Π</mi><mrow><mi>L</mi><mi>C</mi></mrow></msub><mo>=</mo><mo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><mi>max</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><msub><mi>S</mi><mi>T</mi></msub><mo>−</mo><mi>K</mi><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>−</mo><mi>p</mi><mo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mi>M</mi><mi>n</mi><mo>−</mo><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">\\Pi_{LC}=\\bigl(\\max(S_T-K,0)-p\\bigr)Mn-F</annotation></semantics></math></span></div><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Π</mi><mrow><mi>L</mi><mi>P</mi></mrow></msub><mo>=</mo><mo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">(</mo><mi>max</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><mi>K</mi><mo>−</mo><msub><mi>S</mi><mi>T</mi></msub><mo separator=\"true\">,</mo><mn>0</mn><mo stretchy=\"false\">)</mo><mo>−</mo><mi>p</mi><mo fence=\"true\" stretchy=\"true\" minsize=\"1.2em\" maxsize=\"1.2em\">)</mo><mi>M</mi><mi>n</mi><mo>−</mo><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">\\Pi_{LP}=\\bigl(\\max(K-S_T,0)-p\\bigr)Mn-F</annotation></semantics></math></span></div><p>卖出 Call / Put 的毛盈亏是对应买入头寸的相反数，再减去卖方自己的费用。这里是期权经济结果，不表示已完成股票交割，不含交割后股票涨跌。</p>\n <div class=\"table-wrap\"><table><thead><tr><th>头寸</th><th>不含费平衡点</th><th>最大损失</th><th>最大收益</th></tr></thead><tbody><tr><td>Long Call</td><td>K + p</td><td>权利金</td><td>理论无限</td></tr><tr><td>Long Put</td><td>K − p</td><td>权利金</td><td>(K − p) × 乘数</td></tr><tr><td>Short Call（无备兑）</td><td>K + p</td><td>理论无限</td><td>收到的权利金</td></tr><tr><td>Short Put</td><td>K − p</td><td>(K − p) × 乘数</td><td>收到的权利金</td></tr></tbody></table></div>\n <h2>02 / 实值不等于盈利</h2><p>买入 K=$100、p=$5 的 Call。到期股价 $103 时，内在价值 $3，每股净亏 $2，一张亏 $200。到期 $105 才达到不含费平衡。Put 的实值条件相反：股价低于 Strike。</p><p>含费用的 Long Call 到期平衡点为 K+p+F/(Mn)。到期前，可能未突破这个股价就因时间价值变化而盈利平仓，不能用到期平衡点一概判断。</p>\n <h2>03 / 三个实验</h2><ol><li>Long Call：保持 p=$5，将到期股价从 $90 调到 $120。</li><li>换成 Long Put，看盈亏方向反转。</li><li>换成 Short Call，观察图中有限范围，用“理论无限”描述图外风险。</li></ol><div class=\"callout\"><strong>下单前，先写最大损失</strong><p>如果无法解释最大损失、交付义务和到期处理，就先留在模拟环境。保证金占用小不代表风险小。</p></div>","quiz":[{"q":"买入 $100 Call、支付 $5，到期股价 $103，忽略费用，每张净盈亏多少？","options":["盈利 $300","亏损 $200","盈利 $200"],"answer":1,"explain":"($3−$5) × 100 = −$200。"},{"q":"到期盈亏图的平衡点能直接用于判断到期前盈亏吗？","options":["能，任何时候一样","不能，到期前还有时间价值等因素","只看股票涨跌即可"],"answer":1,"explain":"到期前平仓价还受剩余期限、IV 等共同影响。"}]},{"id":4,"short":"定价与 Greeks","title":"股价之外，还有什么在改变价格？","stage":"理解定价","minutes":35,"tag":"定价实验","goal":"理解时间价值，并解释五个常见 Greeks。","refs":[2,3,4],"tool":"pricing","body":"\n <p class=\"lead\">期权价格受股价、Strike、期限、隐含波动率、利率和股息影响。Greeks 描述模型在当前状态对这些变化有多敏感。</p><h2>01 / 内在价值与时间价值</h2><p>Call 内在价值为 max(S−K,0)，Put 为 max(K−S,0)。在普通入门案例中，以权利金减内在价值理解时间价值。股价 $103、$100 Call 报价 $5.50，则内在价值 $3，余下 $2.50 为时间价值。</p>\n <div class=\"table-wrap\"><table><thead><tr><th>指标</th><th>回答的问题</th><th>单位与含义</th></tr></thead><tbody><tr><td>Delta · Δ</td><td>股价涨 $1，期权每股价格约变多少？</td><td>Call 多头通常正，Put 多头通常负</td></tr><tr><td>Gamma · Γ</td><td>股价变 $1，Delta 约变多少？</td><td>近到期平值合约可非常敏感</td></tr><tr><td>Theta · Θ</td><td>过去一天，其他不变，价格约变多少？</td><td>普通多头通常承受时间衰减，并非所有情形恒负</td></tr><tr><td>Vega · ν</td><td>IV 上升 1 个百分点，价格约变多少？</td><td>普通多头 Call / Put 通常为正</td></tr><tr><td>Rho · ρ</td><td>利率上升 1 个百分点，价格约变多少？</td><td>长期合约更应关注</td></tr></tbody></table></div>\n <h2>02 / 从每股到整张合约</h2><p>教学假设 Δ=0.50、Γ=0.04、Θ=−0.06、Vega=0.12。股价涨 $1、过一天、IV 跌 2 个百分点，粗略每股变化为 0.50+0.5×0.04−0.06−0.24=$0.22，一张约 $22。</p><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>≈</mo><mi mathvariant=\"normal\">Δ</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>S</mi><mo>+</mo><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi mathvariant=\"normal\">Γ</mi><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">Δ</mi><mi>S</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">Θ</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>d</mi><mo>+</mo><mi>ν</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>I</mi><msub><mi>V</mi><mrow><mi>p</mi><mi>p</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta V\\approx\\Delta\\,\\Delta S+\\tfrac12\\Gamma(\\Delta S)^2+\\Theta\\,\\Delta d+\\nu\\,\\Delta IV_{pp}</annotation></semantics></math></span></div><p>这是局部近似。大幅变化、跳空与时间推移会改变 Greeks 本身，实际价格还有价差与供需影响。Delta 不是确定的盈利概率。</p>\n <h2>03 / 做“其他条件不变”的实验</h2><p>下方采用无股息 Black–Scholes–Merton 欧式公式。美股股票期权通常是美式；本模型没有提前行权、离散股息、跳跃与流动性，结果不能替代券商报价。先单独调一个参数，再组合变化。</p>","quiz":[{"q":"Vega=0.12，IV 从 30% 到 31%，一张标准合约价格约增加多少？","options":["$0.12","$12","$120"],"answer":1,"explain":"IV 变 1 个百分点，每股约增 $0.12，乘 100 后约 $12。"},{"q":"Delta=0.60，哪项最准确？","options":["有 60% 概率赚钱","股价小涨 $1，每股期权价格局部约涨 $0.60，其他不变","一定获得股票 60% 的涨幅"],"answer":1,"explain":"Delta 是局部价格敏感度，会随股价、时间和 IV 改变。"}]},{"id":5,"short":"波动率与财报","title":"看对财报方向，为什么仍可能亏钱？","stage":"理解定价","minutes":25,"tag":"事件交易","goal":"区分 IV 与历史波动率，理解 IV crush 与事件定价。","refs":[2,3,12],"tool":"volatility","body":"\n <p class=\"lead\">财报前，市场可能已经为剧烈波动支付高价。财报后，即使股价上涨，Call 也可能因 IV 与时间价值回落而亏损。</p><h2>01 / 过去发生了什么，市场现在如何报价</h2><p><b>历史 / 实现波动率</b>来自实际价格变化；<b>IV</b> 从当前期权价格和模型反推。IV 是价格的另一种表达，不是未来波动承诺，更不表示方向。</p><p>同一标的不同 Strike 和到期日的 IV 可不同，形成偏斜与期限结构。比较高低要使用同标的、相近期限和价内外程度。IV Rank / Percentile 还需核对回看窗口与平台算法。</p>\n <h2>02 / 财报前后实验</h2><p>虚构场景：财报前股价 $100、$100 Call 剩 14 天、IV=80%；次日股价涨到 $103，剩 13 天，但 IV=30%。下方用相同模型重新定价，观察方向收益被抵消。不是任何真实公司的财报表现。</p>\n <h2>03 / 市场为多大变化付费？</h2><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>粗略波动尺度</mtext><mo>≈</mo><mi>S</mi><mo>×</mo><mi>I</mi><mi>V</mi><mo>×</mo><msqrt><mrow><mi>D</mi><mi mathvariant=\"normal\">/</mi><mn>365</mn></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\text{粗略波动尺度}\\approx S\\times IV\\times\\sqrt{D/365}</annotation></semantics></math></span></div><p>S=$100、年化 IV=40%、7 个日历日，尺度约 $5.54。它依赖分布与模型假设；跳跃、肥尾、期限差异都会让实际覆盖率偏离，不能承诺“68% 概率落在区间内”。</p><p>另一种参考是同到期近平值 Call+Put 权利金之和。这个成本是跨式的到期盈亏门槛之一，不等于统计意义的一个标准差，不能与前一个方法混用。</p>\n <h2>04 / 写四种情景</h2><ol><li>大涨且超过价格已计入的幅度。</li><li>小涨，但 IV 大跌。</li><li>几乎不动，时间价值减少。</li><li>方向相反，发生跳空。</li></ol><div class=\"callout\"><strong>高 IV 不是卖出期权的充分理由</strong><p>高权利金可能对应高跳跃风险，卖方还承担尾部损失、保证金和指派义务。</p></div>","quiz":[{"q":"财报后股价上涨但买入 Call 亏损，可能的原因是？","options":["Call 不受上涨影响","IV 大幅回落和时间价值减少抵消方向收益","期权只能到期才能卖"],"answer":1,"explain":"看对方向不保证涨幅足够，也不保证买入价格合理。"},{"q":"VIX 能直接当作某只科技股同到期期权的 IV 吗？","options":["可以，都是美股","不可以，VIX 来自 SPX 期权","只在财报日可以"],"answer":1,"explain":"个股有自身事件、偏斜与期限结构，不能用 VIX 替代。"}]},{"id":6,"short":"策略组合","title":"把观点变成有边界的结构","stage":"从策略到实操","minutes":35,"tag":"策略对照","goal":"理解备兑、保护性 Put、现金担保 Put、价差与跨式的取舍。","refs":[4,5,10,11],"tool":"strategies","body":"\n <p class=\"lead\">先写目的：保护已有股票、愿意按某价卖股、愿意接股，还是表达短期观点，再看结构和代价。</p><div class=\"table-wrap\"><table><thead><tr><th>结构</th><th>目的</th><th>代价 / 风险</th></tr></thead><tbody><tr><td>Covered Call<br>100 股 + 卖 1 Call</td><td>愿意按 Strike 卖出股份</td><td>上涨封顶，保留大部分股票下跌风险</td></tr><tr><td>Protective Put<br>100 股 + 买 1 Put</td><td>限定期限内的下跌保护</td><td>支付保费；匹配保护期限和股数</td></tr><tr><td>Cash-Secured Put<br>卖 Put + 留足现金</td><td>愿意按 Strike 接股</td><td>大跌仍要履约，资金占用</td></tr><tr><td>Bull Call Spread<br>买低 Strike Call + 卖高 Strike Call</td><td>有限幅度的上涨观点</td><td>收益封顶，短腿可提前指派</td></tr><tr><td>Bear Put Spread<br>买高 Strike Put + 卖低 Strike Put</td><td>有限幅度的下跌观点</td><td>收益封顶，多腿执行风险</td></tr><tr><td>Long Straddle<br>同 Strike 同到期 Call + Put</td><td>大幅波动，不预设方向</td><td>成本高；变化不足和 IV 回落可导致亏损</td></tr></tbody></table></div>\n <h2>01 / 已有正股：是否愿意失去股份？</h2><p>100 股以 $100 买入，再卖 K=$110、收 $2 的 Call。到期股价 $130，经济收益封顶在 ($110−$100+$2)×100=$1,200；跌到 $60 则仍亏 $3,800，均未计费和股息。</p><p>备兑不是下跌保险。长期核心仓、税务成本或不愿卖股等约束要先写入计划。美式 Call 可提前被指派，除息日前尤其要查时间价值与分红。</p>\n <h2>02 / 牛市 Call 价差</h2><p>同到期买 $100 Call 付 $5；卖 $110 Call 收 $2。净支出 $3 / 股。两腿完整且正确交割，到期最大经济损失 $300、最大收益 $700、平衡点 $103，未计费。</p><p>风险边界依赖两腿完整与处理正确。提前指派、只成交一腿、拆腿或到期后留下股票，都可能产生额外敞口。核对净借记 / 净贷记、比例和资金。</p>\n <h2>03 / 胜率不能替代期望值</h2><p>假设每次 90% 赚 $50、10% 亏 $600，数学期望为 0.9×50−0.1×600=−$15，尚未计费。胜率、赔率、尾部风险与样本可靠性要一起看。</p><div class=\"exercise\"><span>动手练习</span><p>在组合图比较 Long Call、Call 价差、Covered Call 与 Protective Put，写下初始现金、最大损失和交付义务。Short Put 如用现金担保，需另留 Strike×100 现金；图不计算保证金。</p></div>","quiz":[{"q":"持有 100 股并卖一张备兑 Call，股票大跌时通常会怎样？","options":["权利金覆盖所有损失","仍承担大部分股票下跌风险","最大损失就是权利金"],"answer":1,"explain":"权利金仅提供有限缓冲，备兑并不消除股票下跌。"},{"q":"买 $100 Call 付 $5、卖 $110 Call 收 $2，同到期，一组到期最大经济收益是多少？","options":["$300","$700","理论无限"],"answer":1,"explain":"($10 宽度 − $3 净借记) × 100 = $700，未计费且需正确处理两腿。"}]},{"id":7,"short":"第一笔模拟交易","title":"从看链、下单，到退出一笔交易","stage":"从策略到实操","minutes":35,"tag":"完整演练","goal":"完成限价买入、核查成交、平仓与费用计算。","refs":[4,5,6],"tool":"practice","body":"\n <p class=\"lead\">先把步骤做对，再讨论是否值得交易。下方仅为本地模拟，不连接券商、不接收资金、不使用实时行情。</p><h2>01 / 准备账户与规则卡</h2><ol><li>了解券商适用地区、账户类型和期权权限，如实提供经验、目标与财务信息。</li><li>读当前 ODD，确认每张费用、行权截止、到期强平与交付规则。</li><li>在券商模拟账户核验操作。本网页不等于正式券商模拟或适当性审批。</li></ol>\n <h2>02 / 下单前写交易卡</h2><p>记录研究依据、催化剂日期、期限、合约、Bid / Ask、最大计划风险、张数、退出条件与反证。先定可损失金额，再定张数。</p><h2>03 / 限价 BTO</h2><p>在下方选择 Strike 和 Call / Put，以整数张数和 Limit 提交买入开仓。练习引擎仅在买入限价不低于 Ask 时按 Ask 模拟成交，否则显示待成交。真实市场里更低的限价也可能成交，还受排队、深度与行情变化影响。</p>\n <h2>04 / Filled 后再计划 STC</h2><p>提交委托不等于持仓。成交后才建立多头。记录成交价、数量与费用，切换假想后续行情，再卖出同一合约平仓。练习按 Bid 平仓，强调价差成本。</p><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Π</mi><mrow><mi>c</mi><mi>l</mi><mi>o</mi><mi>s</mi><mi>e</mi></mrow></msub><mo>=</mo><mo stretchy=\"false\">(</mo><msub><mi>p</mi><mrow><mi>s</mi><mi>e</mi><mi>l</mi><mi>l</mi></mrow></msub><mo>−</mo><msub><mi>p</mi><mrow><mi>b</mi><mi>u</mi><mi>y</mi></mrow></msub><mo stretchy=\"false\">)</mo><mn>100</mn><mi>n</mi><mo>−</mo><msub><mi>F</mi><mrow><mi>o</mi><mi>p</mi><mi>e</mi><mi>n</mi></mrow></msub><mo>−</mo><msub><mi>F</mi><mrow><mi>c</mi><mi>l</mi><mi>o</mi><mi>s</mi><mi>e</mi></mrow></msub></mrow><annotation encoding=\"application/x-tex\">\\Pi_{close}=(p_{sell}-p_{buy})100n-F_{open}-F_{close}</annotation></semantics></math></span></div>\n <h2>05 / 临近到期不只看盈亏</h2><p>Call 行权需 Strike×100×张数的买股资金。Put 涉及交付股票，也可能形成空头股票。若不希望形成股票头寸，应按计划与券商规则处理到期前平仓，并检查实际成交。</p><p>止损不能保证跳空时按计划价退出。停牌、价差扩大或流动性消失，都可能使亏损大于止损价估计。</p>","quiz":[{"q":"Bid=$4.80、Ask=$5.00，提交 $4.90 限价买单，哪项正确？","options":["一定立即成交","可能成交，也可能不成交","等于已经买入股票"],"answer":1,"explain":"中点不是成交保证，必须核查状态。"},{"q":"$5 买入、$6 平仓，2 张，每张每边费 $0.65，净盈亏是多少？","options":["$200","$197.40","$198.70"],"answer":1,"explain":"毛收益 $200，往返费用 $0.65×2×2=$2.60，净赚 $197.40。"}]},{"id":8,"short":"风险与资金管理","title":"先让一次错误不影响全局","stage":"从策略到实操","minutes":25,"tag":"风险预算","goal":"区分权利金、行权资金、保证金与组合风险。","refs":[4,5,7,15],"tool":"risk","body":"\n <p class=\"lead\">能下单与能承受损失是两件事。先为错误设代价。</p><h2>01 / 从金额开始</h2><p>教学账户 $20,000，某笔普通买入风险预算 $200。这只是算例，不是建议比例。若一张权利金 $250，按全损预算应该得到 0 张，而不是因为不能买半张就向上取整。</p><div class=\"formula\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mo fence=\"true\">⌊</mo><mfrac><mtext>风险预算</mtext><mrow><mn>100</mn><mi>p</mi><mo>+</mo><mtext>每张费用预留</mtext></mrow></mfrac><mo fence=\"true\">⌋</mo></mrow></mrow><annotation encoding=\"application/x-tex\">n=\\left\\lfloor\\frac{\\text{风险预算}}{100p+\\text{每张费用预留}}\\right\\rfloor</annotation></semantics></math></span></div><p>该式仅用于以全额权利金为风险边界的普通买入教学，不能套用到裸卖、股票组合或所有价差。行权后的股票风险另算。</p>\n <h2>02 / 四个数字要分开</h2><ul><li><b>权利金：</b>买入支付或卖出收到的现金。</li><li><b>保证金 / Buying Power：</b>履约担保，不是最大损失。</li><li><b>行权 / 指派：</b>一张 $100 Put 被指派，要按 $10,000 买入 100 股。</li><li><b>组合敞口：</b>科技正股再加科技 Call，可能增加同一风险。</li></ul>\n <h2>03 / 到期与除息日</h2><p>美式空头可能提前被指派。实值 Call 在除息日前时间价值较低时，提前行权动机可能增加，但指派不确定。短腿被指派，不保证长腿自动替你处理。</p><p>到期附近的盘后变化、例外指令与截止时间会产生 pin risk。不能仅凭收盘虚值断言不会留下股票头寸。</p><h2>04 / 三条压力测试</h2><ol><li>一夜跳空 20%，股价和 IV 同变，账户会怎样？</li><li>多个相关持仓一起亏，是否超过组合预算？</li><li>停牌或提前指派时，有没有资金与预案？</li></ol><div class=\"callout\"><strong>先留在可解释的结构</strong><p>0DTE 敏感度高，裸卖可有大额甚至理论无限损失。不要因低报价、高胜率宣传或摊平冲动跳过计算。</p></div>","quiz":[{"q":"预算 $200，一张权利金 $250，忽略费用，按全损预算最多买几张？","options":["0 张","1 张","2 张"],"answer":0,"explain":"向下取整，一张已超预算。"},{"q":"保证金占用 $1,000，意味着最大损失 $1,000 吗？","options":["是，保证金是保险","不是，可能追加且损失可远超它","只有美式才是"],"answer":1,"explain":"保证金不是风险封顶，须独立计算压力损失与交付义务。"}]},{"id":9,"short":"行业与标的研究","title":"从行业判断，走到期权定价","stage":"形成研究框架","minutes":35,"tag":"研究工作台","goal":"串起基本面、催化剂、估值、IV、结构与反证。","refs":[2,12,13,14],"tool":"research","body":"\n <p class=\"lead\">行业长期向好，不代表下个月的 Call 值得买。期权还要求回答：什么时间、幅度多大、价格已经计入多少？</p><h2>01 / 六步研究链</h2><ol><li><b>行业：</b>需求、供给、库存、资本开支与政策在哪个阶段？</li><li><b>公司 / ETF：</b>盈利来源、竞争力、财务质量与持仓集中度？</li><li><b>催化剂：</b>财报、产品或政策何时发生？日期来源是什么？</li><li><b>预期差：</b>比市场预期多知道什么，如何证伪？</li><li><b>定价：</b>估值、IV、偏斜、期限结构、Bid / Ask 是否已反映？</li><li><b>结构：</b>比较不交易、正股、保护与有限风险方向结构。</li></ol>\n <h2>02 / 三情景备忘录</h2><p>全部虚构：行业 ETF 现价 $100，六周后有可核验事件。设乐观 $115、基准 $103、悲观 $85，不赋伪精确概率。$100 Call 售 $5，$100/$110 Call 价差净付 $3。</p><div class=\"table-wrap\"><table><thead><tr><th>到期股价</th><th>100 股正股</th><th>1 张 Call</th><th>1 组价差</th></tr></thead><tbody><tr><td>$115</td><td>+$1,500</td><td>+$1,000</td><td>+$700</td></tr><tr><td>$103</td><td>+$300</td><td>−$200</td><td>$0</td></tr><tr><td>$85</td><td>−$1,500</td><td>−$500</td><td>−$300</td></tr></tbody></table></div><p>未计费、股息、税与交割后风险。投入资本不同，不能仅按收益金额排名，还需比较最大损失和期限。长期逻辑用短期期权表达，可能在逻辑兑现前到期。</p>\n <h2>03 / 关键数字回到原始来源</h2><p>公司投资者关系网站与 EDGAR 查 10-K、10-Q、8-K；ETF 发行商查最新持仓、费率与跟踪规则；经济事件查发布机构日历。新闻用于提出问题，关键数字记录来源、发布日期与覆盖期间。</p><p>Put / Call Ratio、OI 与成交异动只是线索。一笔 Put 可能是买入、卖出、对冲或组合的一腿，不可直接判定“机构做空”。VIX 也不能代替个股 IV。</p>\n <h2>04 / 也认识期权行业本身</h2><p>券商接单与路由，交易所组织撮合，做市商双边报价并管理库存，OCC 作为中央清算方处理清算与履约流程。产业分析可看成交量、费率、产品结构和监管变化；交易量增长不直接等于某家公司的利润增长。</p><div class=\"exercise\"><span>动手练习</span><p>在行业工作台选择行业，为一家公司至少记录三个关键数字的“来源 + 日期 + 口径”，再写一条能改变判断的反证。</p></div>","quiz":[{"q":"认为行业未来三年增长，于是买一周 Call，最明显的问题是什么？","options":["行业研究没有价值","观点期限与合约期限错配","长期增长保证短期盈利"],"answer":1,"explain":"长期基本面可能不会在一周内兑现，时间成本不能忽略。"},{"q":"Put 成交突然增加，能直接推断机构看空吗？","options":["能，Put 永远是买入","不能，可能是卖方、对冲、套利或组合","能，OI 等于净空头"],"answer":1,"explain":"成交量不说明主动买卖与交易意图，需要更多上下文。"}]},{"id":10,"short":"持仓衔接与复盘","title":"为已有正股，建立可复用的记录","stage":"形成研究框架","minutes":30,"tag":"毕业项目","goal":"整理持仓与目标约束，形成研究和复盘档案。","refs":[4,5,7,11],"tool":"portfolio","body":"\n <p class=\"lead\">已有正股是分析起点。先看组合承担了什么，再评估是否需要期权，以及保费、税务和交付代价。</p><h2>01 / 导出可分析的持仓表</h2><p>至少需要代码、数量、平均成本、当前价格或市值、币种和行业。成本可能受拆股、转仓与税务批次影响，保留口径说明。无需账号、身份证件或登录信息。</p><p>还需补充期限、可承受回撤、现金储备、是否愿意卖股或接股、适用税务地区。这些信息不能单凭持仓表推断。之后可将券商文件提供给投资助理，先核对字段和范围再分析。</p>\n <h2>02 / 对已有股票逐项问</h2><ul><li><b>集中度：</b>最大单股与行业权重；多个科技名称可能承担同一风险。</li><li><b>覆盖比例：</b>150 股最多完全备兑 1 张标准 Call，另有 50 股；调整合约另查。</li><li><b>备兑 Call：</b>是否愿意交付股份，并接受上涨封顶和提前指派？</li><li><b>保护性 Put：</b>保护什么期限、Strike 和股数，保费是否值得？</li><li><b>现金担保 Put：</b>真愿意接股吗，有足额现金吗，是否增加集中度？</li></ul>\n <h2>03 / 复盘决策过程</h2><p>记录当时可见信息、备选方案、最大风险、成交、费用和退出原因。盈利可能来自运气，按计划的小损失也可能是合格执行。区分研究判断、结构选择和执行偏差。</p><h2>04 / 毕业项目</h2><ol><li>选一只理解的美股或 ETF，写研究备忘录，附原始来源。</li><li>给三种情景，比较不交易、正股与两种期权结构。</li><li>独立算现金流、最大经济损失、费用及交付资金。</li><li>在模拟环境完成开平仓循环，记录未成交与成交区别。</li><li>通过测验，能用自己的话解释最坏情况。</li></ol><div class=\"callout\"><strong>课程完成不等于实盘能力认证</strong><p>本课程用于教育和研究，不构成针对个人的买卖建议。真实交易前核对券商规则、权限、适用税务与个人承受能力；不能承诺收益。</p></div>","quiz":[{"q":"持有 150 股，最多可用几张标准 Call 完全备兑？","options":["1 张","1.5 张","2 张"],"answer":0,"explain":"标准合约通常 100 股，最多完全备兑 1 张；卖 2 张会有 50 股缺口。"},{"q":"为正股讨论备兑 Call 之前，应先明确什么？","options":["权利金多不多","是否愿意交股并接受提前指派和上涨封顶","哪只股票热门"],"answer":1,"explain":"策略必须服务持仓目标，不能因权利金忽略交付义务。"}]}],"sources":[{"id":1,"org":"OIC · OCC","title":"Options Basics","url":"https://www.optionseducation.org/optionsoverview/options-basics","kind":"基础","access":"免费阅读","why":"先读权利与义务、Call / Put、合约单位。配合第 1、2 课建立术语表。","task":"解释：买入 Put 为什么不等于卖出 Call？"},{"id":2,"org":"OIC · OCC","title":"Options Pricing","url":"https://www.optionseducation.org/optionsoverview/options-pricing","kind":"定价","access":"免费阅读","why":"解释内在价值、时间价值，以及股价、时间、波动率、利率和股息对价格的影响。","task":"在定价实验中保持股价不变，只降低 IV。"},{"id":3,"org":"OIC · OCC","title":"Understanding Options Greeks","url":"https://www.optionseducation.org/advancedconcepts/understanding-options-greeks","kind":"定价","access":"免费阅读","why":"把 Greeks 理解为模型下的局部敏感度，避免误读成收益承诺或准确预测。","task":"解释 Delta、Gamma、Theta、Vega 的含义。"},{"id":4,"org":"FINRA","title":"Options · 投资者指南","url":"https://www.finra.org/investors/investing/investment-products/options","kind":"风险","access":"免费阅读","why":"系统覆盖开平仓、合约类型、到期、指派、保证金和交易风险。适合全程查阅。","task":"区分股票、ETF 与指数期权的交割方式。"},{"id":5,"org":"FINRA","title":"Trading Options: Understanding Assignment","url":"https://www.finra.org/investors/insights/trading-options-understanding-assignment","kind":"实操","access":"免费阅读","why":"解释卖方为何可能提前被指派，以及指派后需要交付什么。","task":"列出持有备兑 Call 遇到除息日应核查的事项。"},{"id":6,"org":"SEC · Investor.gov","title":"Opening an Options Account","url":"https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-77","kind":"实操","access":"免费阅读","why":"了解券商审批考虑的经验、目标、财务状况。不同券商的权限层级名称不统一。","task":"查自己的券商权限、到期截止时间与费用表。"},{"id":7,"org":"OIC · OCC","title":"ODD Quick Guide","url":"https://www.optionseducation.org/referencelibrary/odd-quick-guide","kind":"风险","access":"免费阅读","why":"标准化期权风险说明书的阅读导航。导读不能替代正式 ODD。","task":"从券商或 OCC 获取当前版 ODD，阅读行权与卖方风险。"},{"id":8,"org":"Cboe · Options Institute","title":"Options 101","url":"https://www.cboe.com/optionsinstitute/courses/options101","kind":"基础","access":"课程入口；部分学习路径需免费账号","why":"交易所制作的系统入门课，适合作为第 1、2 课后的英文巩固材料。","task":"写出 underlying / strike / premium / expiration 的含义。"},{"id":9,"org":"Cboe · Options Institute","title":"Payout Diagrams","url":"https://www.cboe.com/optionsinstitute/courses/payout-diagrams/","kind":"策略","access":"课程入口；配套工具可能需账号","why":"先掌握四种基础头寸的到期盈亏，再组合策略。","task":"独立画出 Long Call 与 Short Call 的盈亏方向。"},{"id":10,"org":"Cboe · Options Institute","title":"Spread Strategies: Spread the Risk","url":"https://www.cboe.com/optionsinstitute/courses/spread-strategies/","kind":"策略","access":"课程入口；部分内容可能需账号","why":"理解价差如何改变成本与风险，多腿交易的执行和指派问题。","task":"解释牛市 Call 价差为什么封顶收益。"},{"id":11,"org":"OIC · OCC","title":"All Strategies · 策略索引","url":"https://www.optionseducation.org/strategies/all-strategies-en","kind":"策略","access":"免费索引","why":"按观点和目的检索策略。具体盈亏需读对应条目并自行验算。","task":"比较 Covered Call、Protective Put 和 Cash-Secured Put。"},{"id":12,"org":"Cboe","title":"VIX · 波动率产品与方法入口","url":"https://www.cboe.com/tradable-products/vix/","kind":"研究","access":"免费入口","why":"VIX 来自 SPX 期权定价，不是某只股票的 IV，也不是股市方向预测。","task":"说明为什么 VIX 不能替代个股期权的 IV。"},{"id":13,"org":"Cboe","title":"U.S. Options Market Statistics","url":"https://www.cboe.com/us/options/market_statistics/","kind":"研究","access":"免费入口；数据动态加载","why":"观察期权市场成交量。比较数据前核对日期、全市场或单市场口径及单位。","task":"记录数据日期和单位，再比较不同时期的成交活跃度。"},{"id":14,"org":"SEC · EDGAR","title":"上市公司财报检索","url":"https://www.sec.gov/search-filings","kind":"研究","access":"官方入口；本次自动访问受限","why":"查 10-K、10-Q 与 8-K。本课程未读取具体公司的最新财报或给出现时估值。","task":"对照持仓公司的投资者关系网站查原始财报。"},{"id":15,"org":"OCC","title":"Characteristics and Risks of Standardized Options","url":"https://www.theocc.com/company-information/documents-and-archives/options-disclosure-document","kind":"风险","access":"官方文件入口；本次自动访问受限","why":"正式 ODD 入口，也可向券商索取。本课具体知识核验使用已读取的 OIC、FINRA 等资料。","task":"确认文件版本，结合券商规则阅读原文。"}],"sectors":[{"id":"semiconductor","name":"半导体与 AI","en":"Semiconductors & AI","theme":"把需求增长与已经计入价格的预期分开。","drivers":["数据中心与终端需求、客户资本开支","产能利用率、交期、库存与产品周期","毛利率、先进制程与出口限制"],"metrics":["收入分部与订单 / 指引：公司 10-Q、电话会","毛利率与存货周转：财报并核对口径","客户集中度与资本开支：10-K / 10-Q"],"events":["季度财报与业绩指引","新品发布、客户采购计划","出口与产业政策"],"option":"事件前 IV 可能上升，个股跳空与上下游相关性很强。行业 ETF 可能由少数大公司主导，先核查权重及实际是否有上市期权。","disprove":"增长未转化为现金流、客户资本开支下修，或库存与订单背离。"},{"id":"software","name":"软件与云服务","en":"Software & Cloud","theme":"看增长质量，而不只看增长速度。","drivers":["企业 IT 预算、续费与新增客户","云迁移、AI 产品变现与竞争","单位经济性、销售效率与利率"],"metrics":["ARR / 净收入留存：注意公司定义差异","现金流、股权激励与自由现金流口径","剩余履约义务、收入确认与利润率"],"events":["季度业绩与年度指引","大客户采购与产品调价","利率与宏观数据"],"option":"高估值与财报指引可能带来跳空。检查远近月 IV、偏斜和盘后财报时点。","disprove":"净留存持续下降、获客成本上升，或现金流改善依赖一次性因素。"},{"id":"financials","name":"银行与金融","en":"Banks & Financials","theme":"利率只是起点，信用与资金成本同样重要。","drivers":["收益率曲线、存款竞争与资金成本","信贷需求、违约与拨备","资本充足率、回购与监管"],"metrics":["净息差、存款流动与无息存款占比","不良率、拨备覆盖与贷款类别","资本比率、证券损益与流动性"],"events":["季度财报","美联储决议、就业与通胀","压力测试与监管公告"],"option":"宏观事件与个体信用风险会重叠。金融 ETF 不等于银行 ETF，成分可能含保险、支付和资管。","disprove":"存款成本抬升快于资产收益、信用损失超预期，或资本约束限制分配。"},{"id":"energy","name":"能源与油气","en":"Energy & Oil","theme":"区分商品价格观点与企业现金流观点。","drivers":["油气供需、库存与地缘事件","生产成本、产量与资本开支纪律","炼化价差、业务结构与资本回报"],"metrics":["实现油气价格、产量与单位成本","自由现金流、资本开支与净负债","套期保值、储量与分配覆盖"],"events":["库存和产量数据","产油国政策与地缘事件","财报与资本开支指引"],"option":"能源股不等于原油期货。周末跳空不能靠止损价封顶，股息也会影响提前行权的判断。","disprove":"价格改善未传导到现金流、成本持续抬升或资本开支侵蚀回报。"},{"id":"healthcare","name":"医疗与生物科技","en":"Healthcare & Biotech","theme":"把成熟现金流与二元研发事件分开。","drivers":["患者需求、医保与定价政策","研发管线、专利与竞争","临床试验及商业化能力"],"metrics":["产品收入与专利期限","现金储备、现金消耗与融资需求","临床终点、研究设计与监管文件"],"events":["临床数据与 FDA 决策","财报、专利诉讼与交易","药品定价及报销政策"],"option":"单一审批事件可能带来巨大跳空，连续价格模型尤其脆弱。行业 ETF 也不能消除全部政策风险。","disprove":"关键终点未达成、融资摊薄超预期，或商业化与报销进度落后。"}]};</script>

const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,d=2)=>Number.isFinite(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:d,maximumFractionDigits:d}).format(v):'理论无限';
const signed=v=>(v>0?'+':'')+money(v),fixed=(v,d=2)=>Number(v).toFixed(d);
const STORE='options-notebook-us-v1';let storageOK=true,saved={completed:[],answers:{},notes:[],checklist:[]};

function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved));}catch{storageOK=false;toast('浏览器无法保存数据，请导出手记备份。');}updateProgress();}

const ui={lab:'payoff',strategy:'longcall',sector:'semiconductor',sourceKind:'全部',sourceSearch:'',payoff:{k:100,p:5,k2:110,p2:2,stock:100,n:1,fee:0,end:110},pricing:{s:100,k:100,days:30,iv:30,r:4,type:'call'},trade:{selection:'100-call',limit:5,n:1,fee:.65,scenario:'unchanged',pending:null,position:null,history:[],last:null},holdings:[],noteEdit:null};
const strategies={longcall:'买入 Call',longput:'买入 Put',shortcall:'卖出 Call（无备兑）',shortput:'卖出 Put',bullcall:'牛市 Call 价差',coveredcall:'备兑 Call',protectiveput:'保护性 Put',straddle:'买入跨式'};
function payoff(s,a,type){const{k,p,k2,p2,stock,n,fee}=a,c=Math.max(s-k,0),put=Math.max(k-s,0);let v=0;switch(type){case'longcall':v=c-p;break;case'longput':v=put-p;break;case'shortcall':v=p-c;break;case'shortput':v=p-put;break;case'bullcall':v=c-Math.max(s-k2,0)-p+p2;break;case'coveredcall':v=s-stock+p-c;break;case'protectiveput':v=s-stock+put-p;break;case'straddle':v=c+put-p-p2;break;}return v*100*n-fee;}
function payoffStats(a,type){const{k,p,k2,p2,stock,n,fee}=a,m=100*n;let low=0,high=0,be=[],cash=0;switch(type){case'longcall':low=-p*m-fee;high=Infinity;be=[k+p+fee/m];cash=p*m+fee;break;case'longput':low=-p*m-fee;high=(k-p)*m-fee;be=[k-p-fee/m];cash=p*m+fee;break;case'shortcall':low=-Infinity;high=p*m-fee;be=[k+p-fee/m];cash=-p*m+fee;break;case'shortput':low=(p-k)*m-fee;high=p*m-fee;be=[k-p+fee/m];cash=-p*m+fee;break;case'bullcall':low=-(p-p2)*m-fee;high=(k2-k-p+p2)*m-fee;be=[k+p-p2+fee/m];cash=(p-p2)*m+fee;break;case'coveredcall':low=(p-stock)*m-fee;high=(k-stock+p)*m-fee;be=[stock-p+fee/m];cash=(stock-p)*m+fee;break;case'protectiveput':low=(k-stock-p)*m-fee;high=Infinity;be=[stock+p+fee/m];cash=(stock+p)*m+fee;break;case'straddle':low=-(p+p2)*m-fee;high=Infinity;be=[k-p-p2-fee/m,k+p+p2+fee/m];cash=(p+p2)*m+fee;break;}return{low,high,be:be.filter(x=>x>=0&&Math.abs(payoff(x,a,type))<.0001),cash};}
function normCDF(x){const z=Math.abs(x),t=1/(1+.2316419*z),pdf=Math.exp(-z*z/2)/Math.sqrt(2*Math.PI),p=1-pdf*(.319381530*t-.356563782*t*t+1.781477937*t**3-1.821255978*t**4+1.330274429*t**5);return x>=0?p:1-p;}
function bsm({s,k,days,iv,r,type='call'}){const t=days/365,vol=iv/100,rate=r/100;if(t<=0)return{price:Math.max(type==='call'?s-k:k-s,0),delta:type==='call'?(s>k?1:0):(s<k?-1:0),gamma:0,theta:0,vega:0,rho:0};const rt=Math.sqrt(t),d1=(Math.log(s/k)+(rate+vol*vol/2)*t)/(vol*rt),d2=d1-vol*rt,pdf=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI),discount=Math.exp(-rate*t),call=type==='call',price=call?s*normCDF(d1)-k*discount*normCDF(d2):k*discount*normCDF(-d2)-s*normCDF(-d1),delta=call?normCDF(d1):normCDF(d1)-1,gamma=pdf/(s*vol*rt),theta=(-s*pdf*vol/(2*rt)+(call?-rate*k*discount*normCDF(d2):rate*k*discount*normCDF(-d2)))/365,vega=s*pdf*rt/100,rho=(call?k*t*discount*normCDF(d2):-k*t*discount*normCDF(-d2))/100;return{price:Math.max(0,price),delta,gamma,theta,vega,rho};}
window.OptionMath=Object.freeze({payoff,payoffStats,bsm,normCDF});

function home(){const next=COURSE.lessons.find(l=>!saved.completed.includes(l.id))||COURSE.lessons[0],n=saved.completed.length;return intro('A PRACTICAL GUIDE TO U.S. OPTIONS','每一种选择，都从理解开始。','一份为美股投资者准备的循序渐进学习手册。','<span class="date-label">VOL. 01 / OCT 2026</span>')+`<section class="hero"><div class="hero-copy"><div class="eyebrow">THE OPTIONS NOTEBOOK · 美股期权</div><h2>从一张合约，<br>读懂一种<em>选择。</em></h2><p>从权利与义务出发，读懂价格与波动。<br>用交互实验、模拟交易与行业研究，把概念变成判断。</p><div class="hero-actions"><a class="btn btn-lime" href="#lesson-${next.id}">${n?'继续学习':'开始第一课'} <span>↗</span></a><a class="hero-quicklink" href="#sources">先看看精选资料 →</a></div></div>${heroChart()}</section><div class="fact-row"><div class="fact-card"><span class="fact-icon">▤</span><div><b>10<small>节课</small></b><p>从入门到研究框架</p></div></div><div class="fact-card"><span class="fact-icon">⌁</span><div><b>3<small>个实验</small></b><p>亲手改变参数</p></div></div><div class="fact-card"><span class="fact-icon">↗</span><div><b>15<small>份资料</small></b><p>精选官方英文教程</p></div></div><div class="fact-card"><span class="fact-icon">◷</span><div><b>${n*10}<small>%</small></b><p>已完成 ${n} / 10 课</p></div></div></div><div class="content-grid"><section><div class="section-title"><h2>你的学习路线</h2><p>建议 4 周完成 · 每次 20–35 分钟</p></div><div class="roadmap">${[{title:'先建立概念',text:'弄清买到什么、承担什么，学会读一份合约。',range:[1,2],week:'WEEK 01'},{title:'再理解价格',text:'把股价、时间和波动率，放进同一张图里。',range:[3,4,5],week:'WEEK 02'},{title:'从策略走到实操',text:'比较结构，完成模拟开平仓，设定风险预算。',range:[6,7,8],week:'WEEK 03'},{title:'形成自己的研究框架',text:'连接行业、持仓与交易，留下可回看的判断。',range:[9,10],week:'WEEK 04'}].map((s,i)=>`<div class="stage-card"><span class="stage-index">${String(i+1).padStart(2,'0')}</span><div><div class="stage-head"><h3>${s.title}</h3><span>${s.week}</span></div><p>${s.text}</p><div class="stage-links">${s.range.map(id=>`<a href="#lesson-${id}">${saved.completed.includes(id)?'✓ ':''}${String(id).padStart(2,'0')} ${COURSE.lessons[id-1].short}</a>`).join('')}</div></div></div>`).join('')}</div></section><aside class="home-aside"><div class="aside-card"><div class="tiny">LEARN BY DOING</div><h3>看见曲线的变化，<br>比记住公式更重要。</h3><p>移动股价、时间与 IV，观察合约价格如何改变。每一个参数，都有它的代价。</p><a class="btn btn-secondary btn-small" href="#lab">进入交互实验室 ↗</a></div><div class="aside-quote"><span>“</span><p>先知道最坏会发生什么，<br>再思考最好的结果。</p><small>本课程的第一条学习习惯</small></div></aside></div><div class="home-resource-row">${[{logo:'OIC',title:'从基本原理读起',sub:'OCC · 基础与策略',id:1},{logo:'Cboe',title:'跟交易所系统学习',sub:'Options Institute · 入门课',id:8},{logo:'FINRA',title:'把规则和风险读完整',sub:'投资者指南 · 行权指派',id:4}].map(x=>`<a class="mini-resource" href="${COURSE.sources.find(s=>s.id===x.id).url}" target="_blank" rel="noopener noreferrer"><span class="resource-logo">${x.logo}</span><div><b>${x.title}</b><p>${x.sub}</p></div><span>↗</span></a>`).join('')}</div><div class="notice" style="margin-top:22px;margin-bottom:0">已有美股正股？<a href="#portfolio"><b>整理持仓 →</b></a> 先看集中度与股数，再评估保护或备兑。持仓不会自动上传。</div>${educationNote()}`;}

#home">← 学习路线</a>'}${id<10?`<a class="btn" href="#lesson-${id+1}">下一课 · ${COURSE.lessons[id].short} →</a>`:'<a class="btn" href="#journal">写下毕业项目 →</a>'}</div>${educationNote()}`;}
function lessonTool(tool){if(['payoff','strategies'].includes(tool))return '<section style="margin-top:25px">'+payoffPanel()+'</section>';if(tool==='pricing')return '<section style="margin-top:25px">'+pricingPanel()+'</section>';if(tool==='volatility')return '<section style="margin-top:25px">'+volPanel()+'</section>';if(tool==='risk')return '<section style="margin-top:25px">'+riskPanel()+'</section>';return `<div class="notice" style="margin-top:25px">本课配套实践：<a href="#${tool}"><b>打开${{practice:'模拟交易',research:'行业工作台',portfolio:'持仓工作台'}[tool]} →</b></a></div>`;}
function numeric(id,label,value,min=0,step='.01',max=''){return `<label class="field"><span>${label}</span><input id="${id}" type="number" value="${value}" min="${min}" step="${step}" ${max?`max="${max}"`:''} required></label>`;}
function range(id,label,value,min,max,step,unit=''){return `<label class="field"><span class="field-inline"><span>${label}</span><output id="${id}-value">${value}${unit}</output></span><input id="${id}" type="range" value="${value}" min="${min}" max="${max}" step="${step}"></label>`;}
function payoffPanel(){const a=ui.payoff;return `<section class="panel" id="payoff-panel"><div class="panel-heading"><div><h2>01 / 到期盈亏实验</h2><p>看清边界，再讨论收益。金额均为 USD。</p></div><span class="badge">到期经济价值</span></div><div class="tool-grid"><div><form id="payoff-form" class="form-stack"><label class="field"><span>选择策略</span><select id="payoff-strategy">${Object.entries(strategies).map(([k,v])=>`<option value="${k}" ${ui.strategy===k?'selected':''}>${v}</option>`).join('')}</select></label>${numeric('payoff-k','行权价 K · $',a.k,1,1,10000)}${numeric('payoff-p','每股权利金 p · $',a.p,.01,.01,10000)}<div id="payoff-second" ${['bullcall','straddle'].includes(ui.strategy)?'':'hidden'}>${numeric('payoff-k2','卖出 Call 行权价 K₂ · $',a.k2,1,1,10000)}${numeric('payoff-p2','第二腿每股权利金 · $',a.p2,.01,.01,10000)}</div><div id="payoff-stock-field" ${['coveredcall','protectiveput'].includes(ui.strategy)?'':'hidden'}>${numeric('payoff-stock','正股每股成本 · $',a.stock,.01,.01,10000)}</div><div class="input-pair">${numeric('payoff-n','张数 / 组合数',a.n,1,1,1000)}${numeric('payoff-fee','总费用 · $',a.fee,0,.01,100000)}</div></form><p class="tool-hint">每张 100 股；组合每腿各 n 张。费用手动输入，包含整组交易的预留总额。备兑与保护组合每组配 100 股。</p></div><div><div id="payoff-stats" class="stat-grid"></div><div id="payoff-chart"></div><div class="field" style="margin-top:18px"><label class="field-inline" for="payoff-end"><span>假设到期股价</span><output id="payoff-end-value"></output></label><input id="payoff-end" type="range" min="0" max="170" step=".5" value="${a.end}"></div><div id="payoff-result" class="chart-summary" aria-live="polite"></div><p id="payoff-note" class="tool-hint"></p><p id="payoff-error" class="error" role="alert"></p></div></div></section>`;}
function validatePayoff(a,t){if(!Object.values(a).every(Number.isFinite)||a.k<=0||a.p<=0||a.k2<=0||a.p2<=0||a.stock<=0||a.fee<0||a.n<1||!Number.isInteger(a.n)||a.n>1000||Math.max(a.k,a.p,a.k2,a.p2,a.stock)>10000||a.fee>100000)return '请输入有效正数、整数张数及非负费用，价格不超过 $10,000。';if(t==='bullcall'&&(a.k2<=a.k||a.p2>=a.p||a.p-a.p2>=a.k2-a.k))return '牛市 Call 价差需 K₂ > K，且净借记大于 0、小于行权价宽度。';return '';}
function payoffSVG(a,t){const maxS=Math.max(a.k,a.k2,a.stock,a.end)*1.55,w=640,h=300,pad={l:65,r:20,t:25,b:42},xs=[...Array(101)].map((_,i)=>i*maxS/100);xs.push(a.k,a.k2,a.end);xs.sort((x,y)=>x-y);const vals=xs.map(s=>payoff(s,a,t)),minV=Math.min(...vals,0),maxV=Math.max(...vals,0),gap=Math.max((maxV-minV)*.12,100),lo=minV-gap,hi=maxV+gap,x=s=>pad.l+s/maxS*(w-pad.l-pad.r),y=v=>h-pad.b-(v-lo)/(hi-lo)*(h-pad.t-pad.b),path=xs.map((s,i)=>`${i?'L':'M'}${fixed(x(s))},${fixed(y(payoff(s,a,t)))}`).join(' '),px=x(a.end),py=y(payoff(a.end,a,t));let grid='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=y(v);grid+=`<path d="M${pad.l},${yy}H${w-pad.r}" stroke="#e3e9db" stroke-dasharray="3 5"/><text x="${pad.l-10}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8a9b78">${Math.round(v).toLocaleString('en-US')}</text>`;}for(let i=0;i<=4;i++){const s=maxS*i/4;grid+=`<text x="${x(s)}" y="${h-17}" text-anchor="middle" font-size="10" fill="#8a9b78">$${fixed(s,0)}</text>`;}return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${strategies[t]}到期盈亏图，横轴股价，纵轴美元盈亏"><title>${strategies[t]}的到期盈亏</title>${grid}<text x="${pad.l}" y="14" font-size="9" fill="#8a9b78">盈亏 / USD · 每张 100 股</text><path d="M${pad.l},${y(0)}H${w-pad.r}" stroke="#a7b99a"/><path d="${path}" fill="none" stroke="#356947" stroke-width="2.7" stroke-linejoin="round"/><path d="M${px},${pad.t}V${h-pad.b}" stroke="#afbf91" stroke-dasharray="4 5"/><circle cx="${px}" cy="${py}" r="5" fill="#d7e99e" stroke="#356947" stroke-width="2"/><text x="${w-pad.r}" y="${h-2}" text-anchor="end" font-size="9" fill="#8a9b78">到期股价 / USD</text></svg>`;}
function updatePayoff(){if(!$('#payoff-form'))return;const a=ui.payoff;for(const k of ['k','p','k2','p2','stock','n','fee'])a[k]=Number($('#payoff-'+k).value);ui.strategy=$('#payoff-strategy').value;const t=ui.strategy;$('#payoff-second').hidden=!['bullcall','straddle'].includes(t);$('#payoff-k2').closest('.field').hidden=t==='straddle';$('#payoff-p2').previousElementSibling.textContent=t==='straddle'?'Put 每股权利金 · $':'卖出 Call 权利金 · $';$('#payoff-stock-field').hidden=!['coveredcall','protectiveput'].includes(t);const error=validatePayoff(a,t);$('#payoff-error').textContent=error;if(error){$('#payoff-stats').innerHTML='';$('#payoff-chart').innerHTML='';$('#payoff-result').textContent='修正参数后显示结果';return;}const end=$('#payoff-end');end.max=String(Math.ceil(Math.max(a.k,a.k2,a.stock)*1.7));a.end=Math.min(Number(end.value),Number(end.max));const st=payoffStats(a,t);$('#payoff-stats').innerHTML=stat('到期最大损失',Number.isFinite(st.low)?money(Math.max(0,-st.low)):'理论无限','含输入总费用',Number.isFinite(st.low)?'':'negative')+stat('到期最大净收益',Number.isFinite(st.high)?money(st.high):'理论无限','两腿完整、正确交割')+stat('到期盈亏平衡',st.be.length?st.be.map(x=>money(x)).join(' / '):'无非负解','仅适用于到期');$('#payoff-chart').innerHTML=payoffSVG(a,t);$('#payoff-end-value').textContent=money(a.end);const pnl=payoff(a.end,a,t);$('#payoff-result').innerHTML=`<p>股价 ${money(a.end)} 时<br><small>${a.n} 份 · 总费用 ${money(a.fee)}</small></p><strong class="${pnl>=0?'positive':'negative'}">${signed(pnl)}</strong>`;const notes={shortcall:'无备兑卖 Call 理论损失无限。图仅展示部分范围，不计算保证金与提前指派。',shortput:`现金担保需预留 ${money(a.k*100*a.n)} 接股现金。权利金不是风险上限。`,coveredcall:'初始资金包含正股成本，已有持股还应看机会成本、税务与交付意愿。',protectiveput:'仅保护对应股数和期限，不计股息、税与展期成本。',bullcall:'风险边界以同到期、两腿完整且正确交割为前提，短腿可提前指派。',straddle:'两腿同 Strike 同到期，需较大幅度变化才越过成本门槛。'};$('#payoff-note').textContent=`初始${st.cash>=0?'净支出':'净收入'} ${money(Math.abs(st.cash))}。${notes[t]||'到期经济结果不等于到期前可成交价，不含行权后股票风险。'}`;}
function pricingPanel(){const a=ui.pricing;return `<section class="panel" id="pricing-panel"><div class="panel-heading"><div><h2>02 / 价格与 Greeks 实验</h2><p>一次只改变一个因素，观察局部敏感度。</p></div><span class="badge">无股息 · 欧式</span></div><div class="tool-grid"><div class="form-stack"><label class="field"><span>合约类型</span><select id="price-type"><option value="call" ${a.type==='call'?'selected':''}>Call</option><option value="put" ${a.type==='put'?'selected':''}>Put</option></select></label>${range('price-s','股价 S · $',a.s,50,150,.5)}${range('price-k','行权价 K · $',a.k,60,140,1)}${range('price-days','剩余日历天',a.days,1,365,1,' 天')}${range('price-iv','年化 IV',a.iv,5,150,1,'%')}${range('price-r','年化无风险利率',a.r,0,10,.25,'%')}</div><div><div id="pricing-output"></div><p class="tool-hint">Greeks 按每股显示，整张乘 100；Theta 按日，Vega / Rho 按 1 个百分点。模型假设利率与波动率恒定、连续价格、无股息与提前行权。美股股票 / ETF 通常美式，离散股息与提前行权会造成差异。结果仅供教学，非可成交报价。</p></div></div></section>`;}
function updatePricing(){if(!$('#price-s'))return;const a=ui.pricing;for(const k of ['s','k','days','iv','r']){a[k]=Number($('#price-'+k).value);$('#price-'+k+'-value').textContent=a[k]+({days:' 天',iv:'%',r:'%'}[k]||'');}a.type=$('#price-type').value;const v=bsm(a),intr=Math.max(a.type==='call'?a.s-a.k:a.k-a.s,0);$('#pricing-output').innerHTML=`<div class="model-price"><small>理论每股价格 · ${a.type.toUpperCase()}</small><strong>${money(v.price)}</strong><p>每张约 ${money(v.price*100)} · 无费用</p></div><div class="stat-grid">${stat('内在价值',money(intr))}${stat('模型价 − 内在价值',money(v.price-intr),'不总等于美式时间价值')}${stat('剩余期限',a.days+' 天','按 365 日年化')}</div><div class="greeks-grid">${[['Delta',v.delta,'每 $1 股价'],['Gamma',v.gamma,'Delta / $1'],['Theta',v.theta,'$ / 天'],['Vega',v.vega,'$ / 1%点 IV'],['Rho',v.rho,'$ / 1%点利率']].map(([k,v,u])=>`<div class="greek"><small>${k}</small><strong>${fixed(v,4)}</strong><span>${u}</span></div>`).join('')}</div>`;}
function volPanel(){return `<section class="panel" id="vol-panel"><div class="panel-heading"><div><h2>03 / 财报后的 IV 回落</h2><p>假设财报前 S=$100、K=$100、剩 14 天、IV=80%、利率 4%。</p></div><span class="badge">虚构情景</span></div><div class="scenario-controls">${range('vol-s','财报后股价 · $',103,80,125,.5)}${range('vol-iv','财报后 IV',30,10,120,1,'%')}${range('vol-days','剩余日历天',13,1,14,1,' 天')}</div><div id="vol-output"></div><p class="tool-hint">前后使用相同无股息欧式模型，标准 1 张，买入价为财报前理论价，不计价差和费用。真实报价还受美式行权、股息与流动性影响。</p></section>`;}
function updateVol(){if(!$('#vol-s'))return;const a={s:100,k:100,days:14,iv:80,r:4,type:'call'},before=bsm(a).price,after={...a};for(const k of ['s','iv','days']){after[k]=Number($('#vol-'+k).value);$('#vol-'+k+'-value').textContent=after[k]+({iv:'%',days:' 天'}[k]||'');}const price=bsm(after).price,pnl=(price-before)*100;$('#vol-output').innerHTML=`<div class="contrast-grid"><div class="contrast-card"><h3>财报前 · 理论 Call</h3><strong>${money(before)}</strong><p>股票 $100 / IV 80%</p></div><span class="contrast-arrow">→</span><div class="contrast-card"><h3>财报后 · 理论 Call</h3><strong>${money(price)}</strong><p>股票 ${money(after.s)} / IV ${after.iv}%</p></div></div><div class="chart-summary"><p>股票变化 ${fixed((after.s/100-1)*100)}%，1 张模型盈亏<br><small>IV 与时间可能改变方向交易结果</small></p><strong class="${pnl>=0?'positive':'negative'}">${signed(pnl)}</strong></div>`;}
function riskPanel(){return `<section class="panel"><div class="panel-heading"><div><h2>买入期权 · 全损预算练习</h2><p>自行设定教学预算，不是推荐比例。</p></div><span class="badge">向下取整</span></div><div class="scenario-controls">${numeric('risk-budget','单笔预算 · $',200,0,1,100000000)}${numeric('risk-premium','每股权利金 · $',2.5,.01,.01,100000)}${numeric('risk-fee','每张费用预留 · $',1.3,0,.01,100000)}</div><div id="risk-output" class="stat-grid" aria-live="polite"></div><p class="tool-hint">预留可包括往返费用，仅用于普通买入的全额权利金风险。不适用于卖方、股票、复杂组合或行权后风险。</p></section>`;}
function updateRisk(){if(!$('#risk-budget'))return;const b=Number($('#risk-budget').value),p=Number($('#risk-premium').value),f=Number($('#risk-fee').value);if(![b,p,f].every(Number.isFinite)||b<0||p<=0||f<0){$('#risk-output').innerHTML='<p class="error">请输入非负预算与费用、正数权利金。</p>';return;}const n=Math.floor(b/(p*100+f));$('#risk-output').innerHTML=stat('预算允许最多',n+' 张')+stat('全损金额含费用',money(n*(p*100+f)))+stat('预算剩余',money(b-n*(p*100+f)));}
function labPage(){return intro('INTERACTIVE LAB','让参数说话。','到期盈亏、到期前定价、财报 IV 回落，分开观察。')+`<div class="segmented" aria-label="实验选择">${[['payoff','到期盈亏'],['pricing','定价与 Greeks'],['volatility','财报与 IV']].map(([k,v])=>`<button class="${ui.lab===k?'active':''}" data-lab="${k}">${v}</button>`).join('')}</div>`+(ui.lab==='payoff'?payoffPanel():ui.lab==='pricing'?pricingPanel():volPanel())+(ui.lab==='payoff'?riskPanel():'')+educationNote();}
const contracts=[{k:95,type:'call',bid:7.6,ask:7.8,volume:1820,oi:8210},{k:100,type:'call',bid:4.8,ask:5,volume:3640,oi:14520},{k:105,type:'call',bid:2.6,ask:2.8,volume:2105,oi:9320},{k:95,type:'put',bid:2.3,ask:2.5,volume:1420,oi:7420},{k:100,type:'put',bid:4.5,ask:4.7,volume:2780,oi:12110},{k:105,type:'put',bid:7.3,ask:7.5,volume:1230,oi:6830}];
const scenarios={unchanged:{name:'初始报价 · S=$100',s:100,days:30,iv:42},bullish:{name:'情景 A · 股价涨到 $112',s:112,days:15,iv:32},bearish:{name:'情景 B · 股价跌到 $90',s:90,days:15,iv:48},quiet:{name:'情景 C · 股价 $100，IV 回落',s:100,days:15,iv:25}};
function contractKey(c){return c.k+'-'+c.type;}
function quote(c){if(ui.trade.scenario==='unchanged')return{bid:c.bid,ask:c.ask};const s=scenarios[ui.trade.scenario],v=bsm({...s,k:c.k,type:c.type,r:4}).price;return{bid:Math.max(.01,Math.round((v-.10)*100)/100),ask:Math.max(.02,Math.round((v+.10)*100)/100)};}
function tradePage(){const t=ui.trade,c=contracts.find(c=>contractKey(c)===t.selection),q=quote(c),active=!!(t.position||t.pending),scene=scenarios[t.scenario];return intro('PAPER TRADING','把第一笔交易，留在模拟里。','完整练习 BTO → 成交核查 → 情景变化 → STC → 复盘。','<button class="btn btn-secondary btn-small" data-action="reset-trade">重置练习</button>')+`<div class="notice">DEMO 是教学代号，全部行情、Volume、OI 均为虚构；后续情景用简化模型生成。没有券商连接，不使用真实资金。练习最多同时持有一个多头，不做卖出开仓。</div><div class="order-layout"><section class="panel"><div class="panel-heading"><div><h2>DEMO · 股票期权链</h2><p>初始剩 30 天 / 标准每张 100 股 / 美式股票合约教学</p></div><span class="badge">虚构链</span></div><label class="field"><span>行情情景 · 成交后可切换观察</span><select id="trade-scenario" ${t.pending?'disabled':''}>${Object.entries(scenarios).map(([k,s])=>`<option value="${k}" ${t.scenario===k?'selected':''}>${s.name}</option>`).join('')}</select></label><p class="tool-hint">当前股价 ${money(scene.s)}，剩余 ${scene.days} 天；情景 IV ${scene.iv}%。持仓按 Bid 估计可平仓价值。</p><div class="table-wrap"><table class="chain-table"><thead><tr><th>合约 · 点击选择</th><th>Bid</th><th>Ask</th><th>Volume</th><th>OI</th></tr></thead><tbody>${contracts.map(c=>{const k=contractKey(c),q=quote(c);return `<tr class="${k===t.selection?'selected':''}"><td><button type="button" data-contract="${k}" ${active?'disabled':''}>$${c.k} ${c.type.toUpperCase()}</button></td><td>${money(q.bid)}</td><td>${money(q.ask)}</td><td>${c.volume.toLocaleString('en-US')}</td><td>${c.oi.toLocaleString('en-US')}</td></tr>`;}).join('')}</tbody></table></div><p class="tool-hint">Volume 和 OI 为固定示意数据，非情景变化后的真实统计；模拟忽略排队、深度、部分成交和停牌。</p></section><aside class="order-card"><h3>01 / 买入开仓 BTO</h3><p style="font-size:12px">DEMO · $${c.k} ${c.type.toUpperCase()} · 同一假想到期日</p><form id="trade-order"><div class="form-stack">${numeric('trade-limit','限价 · 每股 $',t.limit,.01,.01,100000)}${numeric('trade-n','张数',t.n,1,1,100)}${numeric('trade-fee','每张每边费用 · $',t.fee,0,.01,1000)}</div><p class="tool-hint" id="trade-estimate"></p><button class="btn" type="submit" ${active?'disabled':''}>按规则模拟提交 BTO →</button><p class="error" id="trade-error" role="alert"></p></form><p class="tool-hint">当前 Ask ${money(q.ask)}。限价 ≥ Ask 时按 Ask 模拟成交；更低限价进入待成交，不自动撮合。市场中较低限价也可能成交。</p></aside></div><section class="panel"><div class="panel-heading"><div><h2>02 / 委托、持仓与退出</h2><p>先看状态，再看盈亏。</p></div><span class="badge">${t.position?'FILLED · 持有多头':t.pending?'PENDING · 未成交':'当前无持仓'}</span></div>${t.pending?`<div class="notice">待成交：${t.pending.n} 张 $${t.pending.k} ${t.pending.type.toUpperCase()}，限价 ${money(t.pending.limit)}。未形成持仓，未扣费用。<button class="text-button" data-action="cancel-order">撤销模拟委托</button></div>`:''}${t.position?positionHTML():!t.pending?'<div class="empty-state">选择合约并提交一笔买入开仓，再切换情景练习平仓。</div>':''}${t.last?`<div class="notice" style="margin-top:15px">已平仓：${t.last.n} 张 $${t.last.k} ${t.last.type.toUpperCase()}，净盈亏 <b class="${t.last.pnl>=0?'positive':'negative'}">${signed(t.last.pnl)}</b>。<button class="text-button" data-action="trade-to-journal" ${t.last.saved?'disabled':''}>${t.last.saved?'已保存':'写入学习手记 →'}</button></div>`:''}<div class="trade-log">${t.history.slice().reverse().map(h=>`<div class="log-entry"><b>${esc(h.title)}</b>${esc(h.detail)}</div>`).join('')}</div></section>${educationNote()}`;}
function positionHTML(){const p=ui.trade.position,c=contracts.find(c=>contractKey(c)===contractKey(p)),q=quote(c),pnl=(q.bid-p.entry)*100*p.n-p.fee*p.n*2;return `<div class="stat-grid">${stat('开仓成本含费用',money(p.entry*100*p.n+p.fee*p.n),p.n+' 张 · 每股 '+money(p.entry))}${stat('Bid 估计可平仓净盈亏',signed(pnl),'预扣开平仓两边费用',pnl>=0?'positive':'negative')}${stat('若 Call 行权，买股资金',p.type==='call'?money(p.k*100*p.n):'Put 涉及交付股票','不等于权利金风险')}</div><div class="action-row"><button class="btn" data-action="close-trade">按当前 Bid ${money(q.bid)} 模拟 STC</button><span class="tool-hint">一次全数平仓 · 无提前行权模拟</span></div>`;}
function tradeEstimate(){if(!$('#trade-limit'))return;const t=ui.trade;for(const k of ['limit','n','fee']){const el=$('#trade-'+k);el.disabled=!!(t.position||t.pending);if(!el.disabled)t[k]=Number(el.value);}$('#trade-estimate').textContent=`限价预算约 ${money((t.limit*100+t.fee)*t.n)}。实际成交按 Ask，费用每边单独计。`;}
function submitTrade(e){e.preventDefault();const t=ui.trade;if(t.position||t.pending)return;tradeEstimate();if(!Number.isFinite(t.limit)||!Number.isFinite(t.fee)||t.limit<=0||t.limit>100000||t.fee<0||t.fee>1000||!Number.isInteger(t.n)||t.n<1||t.n>100){$('#trade-error').textContent='请输入有效限价、非负费用和 1–100 的整数张数。';return;}const c=contracts.find(c=>contractKey(c)===t.selection),q=quote(c);if(t.limit+1e-9>=q.ask){t.position={...c,entry:q.ask,n:t.n,fee:t.fee,scenario:t.scenario};t.history.push({title:'BTO · Filled · 买入开仓成交',detail:`${t.n} 张 $${c.k} ${c.type.toUpperCase()}，每股 ${money(q.ask)}；开仓费用 ${money(t.fee*t.n)}。`});toast('模拟成交，已建立多头。下一步切换行情情景。');}else{t.pending={...c,n:t.n,limit:t.limit};t.history.push({title:'BTO · Pending · 待成交',detail:'低于 Ask，未形成持仓。需要撤单后重新提交。'});toast('委托未成交，当前没有持仓。');}render(false);}
function closeTrade(){const t=ui.trade,p=t.position;if(!p)return;const c=contracts.find(c=>contractKey(c)===contractKey(p)),q=quote(c),pnl=(q.bid-p.entry)*100*p.n-p.fee*p.n*2;t.last={...p,exit:q.bid,pnl,exitScenario:t.scenario,saved:false};t.history.push({title:'STC · Filled · 卖出平仓成交',detail:`${p.n} 张以每股 ${money(q.bid)} 平仓，往返费用 ${money(p.fee*p.n*2)}，净盈亏 ${signed(pnl)}。`});t.position=null;toast('模拟平仓完成，可以写入手记复盘。');render(false);}
function researchPage(){const s=COURSE.sectors.find(s=>s.id===ui.sector);return intro('RESEARCH DESK','先研究生意，再研究合约。','行业框架用于组织证据，不提供当前行业评级或买卖推荐。')+`<div class="research-tabs" aria-label="行业选择">${COURSE.sectors.map(s=>`<button class="${s.id===ui.sector?'active':''}" data-sector="${s.id}">${s.name}</button>`).join('')}</div><section class="research-hero"><small>${s.en.toUpperCase()}</small><h2>${s.name}</h2><p>${s.theme}</p></section><div class="three-grid">${[['01 / 关键驱动',s.drivers],['02 / 去哪里核查',s.metrics],['03 / 催化剂日历',s.events]].map(([title,arr])=>`<section class="panel"><h3>${title}</h3><ol>${arr.map(x=>`<li>${x}</li>`).join('')}</ol></section>`).join('')}</div><div class="research-note-grid"><section class="panel"><h3>把研究连接到期权</h3><p>${s.option}</p></section><section class="panel"><h3>什么会让判断失效？</h3><p>${s.disprove}</p></section></div><section class="panel"><div class="panel-heading"><div><h2>一页研究备忘录</h2><p>至少记录来源、日期、口径与反证。保存到本地学习手记。</p></div><span class="badge">证据优先</span></div><form id="research-note" class="journal-form"><label class="field"><span>研究对象 · 股票或 ETF 代码</span><input name="ticker" required maxlength="40" placeholder="例如：自己的持仓代码"></label><label class="field"><span>观点期限 / 待核查事件日期</span><input name="horizon" required maxlength="100" placeholder="例如：下次财报前后；日期待核实"></label><label class="field full"><span>证据与来源（含日期、口径）</span><textarea name="evidence" required maxlength="10000" placeholder="关键数字｜原始来源链接｜发布日期｜覆盖期间"></textarea></label><label class="field"><span>乐观 / 基准 / 悲观情景</span><textarea name="scenarios" required maxlength="5000" placeholder="写假设与因果链，避免伪精确概率"></textarea></label><label class="field"><span>反证与不交易的理由</span><textarea name="disprove" required maxlength="5000" placeholder="什么信息出现会改变判断？"></textarea></label><div class="full action-row"><button class="btn" type="submit">保存研究手记 →</button><a class="text-button" href="#lesson-9">回看完整行业研究课</a></div></form></section><section class="panel"><h3>也理解期权行业的运作</h3><div class="example-strip"><span>投资者 → 券商路由</span><span>交易所撮合 ↔ 做市商报价</span><span>OCC 清算与履约</span></div><p class="tool-hint">读产业数据先核对“成交张数 / 名义价值”“单交易所 / 全市场”“日期 / 口径”。成交增加不直接代表利润上升。 <a href="https://www.cboe.com/us/options/market_statistics/" target="_blank" rel="noopener noreferrer"><b>Cboe 官方统计 ↗</b></a> · <a href="https://www.sec.gov/search-filings" target="_blank" rel="noopener noreferrer"><b>EDGAR 原始财报入口 ↗</b></a></p></section>${educationNote()}`;}

const holdingColumns=[['ticker','股票代码','Ticker'],['quantity','股数','Quantity'],['cost','平均成本 $','AverageCost'],['price','当前价格 $','LastPrice'],['sector','行业','Sector']];
function portfolioPage(){return intro('PORTFOLIO BRIDGE','从你的正股持仓开始。','整理数据，识别集中度，为之后的个性化研究做好准备。','<button class="btn btn-secondary btn-small" data-action="holding-template">下载 CSV 模板 ↗</button>')+`<div class="notice">持仓仅在当前页面运行期间保留，刷新会清除，不会自动上传或写入浏览器长期存储。仅支持 USD 计价的股票 / ETF 多头，不含现金、期权、空头和负债；下方占比仅基于本次录入的股票市值，不代表全账户配置。</div><section class="panel"><div class="panel-heading"><div><h2>01 / 录入或导入持仓</h2><p>先按模板对齐字段。代码、数量、平均成本、当前价格、行业、Currency=USD。</p></div><span class="badge">本地计算</span></div><div class="action-row"><button class="btn btn-secondary btn-small" data-action="add-holding">＋ 添加一行</button><label class="btn btn-secondary btn-small file-label">导入 CSV<input id="holding-file" type="file" accept=".csv,text/csv" aria-label="导入持仓 CSV"></label><button class="text-button" data-action="sample-holdings">载入虚构示例</button><button class="text-button danger-button" data-action="clear-holdings">清空本次数据</button></div>${ui.holdings.length?`<div class="table-wrap"><table class="portfolio-table"><thead><tr>${holdingColumns.map(([,label])=>`<th>${label}</th>`).join('')}<th>操作</th></tr></thead><tbody>${ui.holdings.map((h,i)=>`<tr>${holdingColumns.map(([k,label])=>`<td><input data-holding-index="${i}" data-holding-key="${k}" aria-label="第${i+1}行${label}" value="${esc(h[k])}" ${['quantity','cost','price'].includes(k)?'type="number" min="0" step="any"':'type="text" maxlength="60"'}></td>`).join('')}<td><button class="text-button danger-button" data-remove-holding="${i}">移除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state" style="margin-top:20px">还没有持仓。可以添加一行、导入模板，或先看虚构示例。</div>'}<div class="action-row" style="margin-top:18px"><button class="btn" data-action="analyze-holdings" ${ui.holdings.length?'':'disabled'}>计算持仓概览 →</button><p class="error" id="holding-error" role="alert"></p></div></section><div id="holding-analysis" aria-live="polite"></div><div class="help-grid"><section class="panel"><h3>之后一起分析时，还需要知道</h3><ul><li>持有期限与这笔资金的用途</li><li>可承受回撤与现金储备</li><li>是否愿意在指定价格卖出已有股票</li><li>是否愿意因卖 Put 增持股票</li><li>账户权限、适用税务地区与限制</li></ul><p class="tool-hint">这些信息影响结构选择，不能从股票数量自动推断。暂不清楚的项目可以先留空。</p></section><section class="panel"><h3>上传券商导出前</h3><ul><li>保留代码、数量、成本和市值等分析字段</li><li>删去账号、证件、住址和登录信息</li><li>注明导出日期、币种和成本口径</li><li>若有期权、现金、空头，另表列出</li><li>备兑股数上限不等于策略推荐</li></ul><a class="text-button" href="#lesson-10">回看持仓衔接与复盘课 →</a></section></div>${educationNote()}`;}
function validHoldings(rows){if(!rows.length)throw Error('请先录入持仓。');if(rows.length>500)throw Error('最多支持 500 行。');const seen=new Set();return rows.map((h,i)=>{const ticker=String(h.ticker).trim().toUpperCase(),quantity=Number(h.quantity),cost=Number(h.cost),price=Number(h.price),sector=String(h.sector||'未分类').trim()||'未分类';if(!/^[A-Z0-9.^/-]{1,20}$/.test(ticker))throw Error('第 '+(i+1)+' 行代码无效。');if([h.quantity,h.cost,h.price].some(v=>String(v).trim()==='')||![quantity,cost,price].every(Number.isFinite)||quantity<=0||cost<0||price<=0||quantity>1e9||cost>1e9||price>1e9)throw Error('第 '+(i+1)+' 行需要正数股数与价格、非负成本。');if(seen.has(ticker))throw Error(ticker+' 重复：请先合并为一行，并使用加权平均成本。');seen.add(ticker);return{ticker,quantity,cost,price,sector:sector.slice(0,60)};});}
function analyzeHoldings(){const out=$('#holding-analysis'),err=$('#holding-error');if(!out)return;try{const rows=validHoldings(ui.holdings),total=rows.reduce((v,h)=>v+h.quantity*h.price,0),cost=rows.reduce((v,h)=>v+h.quantity*h.cost,0),pnl=total-cost,sectors=new Map();for(const h of rows)sectors.set(h.sector,(sectors.get(h.sector)||0)+h.quantity*h.price);const ordered=[...sectors].sort((a,b)=>b[1]-a[1]);err.textContent='';out.innerHTML=`<section class="panel"><h2 style="font-size:18px">02 / 本次录入正股概览</h2><div class="portfolio-summary">${stat('录入股票总市值',money(total),rows.length+' 个代码，不含现金及其他资产')}${stat('成本差额（浮动）',signed(pnl),'不含股息、已实现损益、费用与税',pnl>=0?'positive':'negative')}${stat('最大单股权重',fixed(Math.max(...rows.map(h=>h.quantity*h.price))/total*100,1)+'%','按输入价格计算')}</div><div class="help-grid"><div><h3>行业分布 · 手工行业标签</h3>${ordered.map(([name,v])=>`<div class="allocation-row"><div class="allocation-label"><span>${esc(name)}</span><span>${fixed(v/total*100,1)}%</span></div><div class="allocation-track"><i style="width:${v/total*100}%"></i></div></div>`).join('')}</div><div><h3>标准合约的纯股数上限</h3><div class="table-wrap"><table><thead><tr><th>代码</th><th>现有股数</th><th>完整 100 股组数</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${esc(h.ticker)}</td><td>${h.quantity}</td><td>${Math.floor(h.quantity/100)} 组</td></tr>`).join('')}</tbody></table></div></div></div><p class="tool-hint">仅按标准每张 100 股计算，未验证代码是否有上市期权、是否为调整合约、股份能否交付、券商权限与税务。若计划卖出 Call，还要确认是否愿意按 Strike 交付股份；不会据此自动推荐交易。</p></section>`;}catch(e){err.textContent=e.message;out.innerHTML='';}}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"'){if(cell)throw Error('CSV 引号格式错误。');quoted=true;}else if(c===','){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV 引号未闭合。');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows;}
function holdingsFromCSV(text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSV 只有表头或没有内容，请填入持仓。');const heads=rows.shift().map(v=>v.trim().toLowerCase().replace(/[ _]/g,'')),aliases={ticker:['ticker','symbol','代码','股票代码'],quantity:['quantity','shares','数量','股数'],cost:['averagecost','avgcost','平均成本','成本价'],price:['lastprice','currentprice','最新价','当前价格','现价'],sector:['sector','行业'],currency:['currency','币种']},idx={};for(const[k,arr]of Object.entries(aliases))idx[k]=heads.findIndex(x=>arr.includes(x));for(const k of ['ticker','quantity','cost','price'])if(idx[k]<0)throw Error('缺少 '+holdingColumns.find(c=>c[0]===k)[2]+' 列，请使用下载模板。');const clean=v=>String(v??'').replace(/[$,]/g,'').trim();const result=rows.map((r,i)=>{if(idx.currency>=0&&r[idx.currency]?.trim().toUpperCase()!=='USD')throw Error('第 '+(i+2)+' 行币种不是 USD，请分开处理。');return{ticker:r[idx.ticker]||'',quantity:clean(r[idx.quantity]),cost:clean(r[idx.cost]),price:clean(r[idx.price]),sector:idx.sector>=0?r[idx.sector]:'未分类'};});return validHoldings(result);}
window.OptionCSV=Object.freeze({parseCSV,holdingsFromCSV});
function addNote(title,body,kind='学习手记',id=null){if(saved.notes.length>=100&&!id){toast('手记已达 100 条，请先导出并整理。');return false;}const note={id:id||crypto.randomUUID(),title:String(title).slice(0,160),body:String(body).slice(0,30000),kind,date:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})},index=saved.notes.findIndex(n=>n.id===id);if(index>=0)saved.notes[index]=note;else saved.notes.unshift(note);persist();toast('已保存到当前浏览器的学习手记。');return true;}
function journalPage(){const note=saved.notes.find(n=>n.id===ui.noteEdit),checks=['能够解释四种基础头寸和到期义务','独立计算最大损失、盈亏平衡和费用','完成至少一次模拟开仓与平仓','为研究数字记录原始来源和日期','比较不交易、正股和期权的取舍'];return intro('PERSONAL NOTEBOOK','留下判断，比留下结果更重要。','进度与手记保存在当前浏览器，建议定期导出。持仓工作台数据不包含在导出中。','<button class="btn btn-secondary btn-small" data-action="export-notes">导出 JSON 备份 ↗</button>')+`<section class="panel"><h2 style="font-size:18px">毕业项目检查</h2><div class="checklist">${checks.map((c,i)=>`<label><input type="checkbox" data-checklist="${i}" ${saved.checklist.includes(i)?'checked':''}>${c}</label>`).join('')}</div></section><section class="panel"><div class="panel-heading"><div><h2>${note?'编辑手记':'新建一条手记'}</h2><p>研究、交易计划、复盘都可以。不要记录账号或登录凭据。</p></div><span class="badge">本地保存</span></div><form id="journal-form" class="journal-form"><label class="field full"><span>标题</span><input name="title" maxlength="160" required placeholder="例如：第一次模拟 Call 开平仓复盘" value="${esc(note?.title||'')}"></label><label class="field full"><span>依据 → 结构 → 最坏情况 → 退出 → 复盘</span><textarea name="body" maxlength="30000" required style="min-height:170px" placeholder="当时看到了什么？有什么反证？为什么选择这个期限和结构？实际结果与计划哪里不同？">${esc(note?.body||'')}</textarea></label><div class="full action-row"><button type="submit" class="btn">${note?'保存修改':'保存手记'} →</button>${note?'<button type="button" class="text-button" data-action="cancel-note-edit">取消编辑</button>':''}</div></form></section><div class="section-title"><h2>我的手记 · ${saved.notes.length}</h2><p>保留当时的证据与不确定性</p></div>${saved.notes.length?saved.notes.map(n=>`<article class="journal-entry"><small>${esc(n.kind)} · ${esc(n.date)}</small><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="entry-actions"><button class="text-button" data-edit-note="${esc(n.id)}">编辑</button><button class="text-button danger-button" data-delete-note="${esc(n.id)}">删除此条</button></div></article>`).join(''):'<div class="empty-state">还没有手记。可以从一次实验的观察开始，或将模拟交易结果写入这里。</div>'}`;}
function closeMenu(){$('#sidebar').classList.remove('open');$('#nav-backdrop').hidden=true;$('#menu-button').setAttribute('aria-expanded','false');}
function render(focus=true){const route=location.hash.slice(1)||'home',match=/^lesson-(\d+)$/.exec(route);const pages={home:['学习总览',home],lab:['交互实验室',labPage],practice:['模拟交易',tradePage],research:['行业研究',researchPage],sources:['精选教程与来源',sourcesPage],portfolio:['正股持仓',portfolioPage],journal:['学习手记',journalPage]};let title,html;if(match&&Number(match[1])>=1&&Number(match[1])<=10){const id=Number(match[1]);title=COURSE.lessons[id-1].short;html=lessonPage(id);}else{const p=pages[route]||pages.home;title=p[0];html=p[1]();}$('#page-label').textContent=title;document.title=title+' · 期权研习室';$('#main').innerHTML='<div class="page-enter">'+html+'</div>';$$('[data-nav]').forEach(a=>{const selected=a.dataset.nav===route;a.classList.toggle('active',selected);if(selected)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});updateProgress();updatePayoff();updatePricing();updateVol();updateRisk();updateSources();tradeEstimate();const quiz=$('#lesson-quiz');if(quiz)quiz.addEventListener('submit',checkQuiz);$('#trade-order')?.addEventListener('submit',submitTrade);$('#research-note')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);const body=`期限 / 事件：${f.get('horizon')}\n\n证据与来源：\n${f.get('evidence')}\n\n三情景：\n${f.get('scenarios')}\n\n反证与不交易理由：\n${f.get('disprove')}`;if(addNote(f.get('ticker')+' · '+COURSE.sectors.find(s=>s.id===ui.sector).name,body,'行业研究'))e.target.reset();});$('#journal-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(addNote(f.get('title'),f.get('body'),'学习手记',ui.noteEdit)){ui.noteEdit=null;render(false);}});closeMenu();if(focus){window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});}}
function checkQuiz(e){e.preventDefault();const id=Number(e.target.dataset.lesson),l=COURSE.lessons[id-1],f=new FormData(e.target),answers=l.quiz.map((q,i)=>Number(f.get('q'+i)));let correct=0;l.quiz.forEach((q,i)=>{const good=answers[i]===q.answer;if(good)correct++;const el=$('#feedback-'+i);el.className='quiz-feedback '+(good?'correct':'incorrect');el.textContent=(good?'✓ 答对了。':'还需要想一想。')+q.explain;});saved.answers[id]=answers;if(correct===l.quiz.length&&!saved.completed.includes(id))saved.completed.push(id);persist();$('#quiz-result').textContent=correct===l.quiz.length?'✓ 已通过，本课进度已记录。':`答对 ${correct} / ${l.quiz.length}。读一下解释后重试。`;}
document.addEventListener('input',e=>{const el=e.target,id=el.id;if(id.startsWith('payoff-'))updatePayoff();if(id.startsWith('price-'))updatePricing();if(id.startsWith('vol-'))updateVol();if(id.startsWith('risk-'))updateRisk();if(id.startsWith('trade-')&&id!=='trade-scenario')tradeEstimate();if(id==='source-search'){ui.sourceSearch=el.value;updateSources();}if(el.dataset.holdingKey){ui.holdings[Number(el.dataset.holdingIndex)][el.dataset.holdingKey]=el.value;$('#holding-analysis').innerHTML='';$('#holding-error').textContent='数据已修改，点击计算更新概览。';}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='trade-scenario'){ui.trade.scenario=el.value;render(false);}if(el.dataset.checklist!==undefined){const n=Number(el.dataset.checklist);saved.checklist=saved.checklist.filter(v=>v!==n);if(el.checked)saved.checklist.push(n);persist();}if(el.id==='holding-file'&&el.files[0]){try{const file=el.files[0];if(file.size>1024*1024)throw Error('CSV 请控制在 1 MB 以内。');ui.holdings=holdingsFromCSV(await file.text());render(false);analyzeHoldings();toast('导入成功，仅在本次页面运行中保留。');}catch(err){$('#holding-error').textContent=err.message;el.value='';}}});
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.tagName==='A'&&el.getAttribute('href')===location.hash)closeMenu();if(el.dataset.openTool){const tool=el.dataset.openTool;ui.lab=tool==='pricing'?'pricing':tool==='volatility'?'volatility':'payoff';if(tool==='strategies')ui.strategy='bullcall';}if(el.dataset.lab){ui.lab=el.dataset.lab;render(false);}if(el.dataset.sector){ui.sector=el.dataset.sector;render(false);}if(el.dataset.sourceKind){ui.sourceKind=el.dataset.sourceKind;render(false);}if(el.dataset.contract&&!ui.trade.position&&!ui.trade.pending){ui.trade.selection=el.dataset.contract;ui.trade.limit=quote(contracts.find(c=>contractKey(c)===ui.trade.selection)).ask;render(false);}if(el.dataset.removeHolding!==undefined){ui.holdings.splice(Number(el.dataset.removeHolding),1);render(false);}if(el.dataset.deleteNote){saved.notes=saved.notes.filter(n=>n.id!==el.dataset.deleteNote);if(ui.noteEdit===el.dataset.deleteNote)ui.noteEdit=null;persist();render(false);toast('该条手记已删除。');}if(el.dataset.editNote){ui.noteEdit=el.dataset.editNote;render();}switch(el.dataset.action){case'reset-trade':ui.trade={selection:'100-call',limit:5,n:1,fee:.65,scenario:'unchanged',pending:null,position:null,history:[],last:null};render(false);break;case'cancel-order':ui.trade.pending=null;ui.trade.history.push({title:'Canceled · 已撤销',detail:'未形成持仓，未扣费用。'});render(false);break;case'close-trade':closeTrade();break;case'trade-to-journal':{const t=ui.trade.last;if(t&&!t.saved){t.saved=addNote('DEMO 模拟交易复盘',`合约：$${t.k} ${t.type.toUpperCase()}，${t.n} 张\n买入每股：${money(t.entry)}\n平仓每股：${money(t.exit)}\n往返费用：${money(t.fee*t.n*2)}\n净盈亏：${signed(t.pnl)}\n开仓情景：${scenarios[t.scenario].name}\n平仓情景：${scenarios[t.exitScenario].name}\n\n以上为虚构模拟。补充：研究依据、计划风险、执行偏差和反证。`,'模拟复盘');render(false);}break;}case'holding-template':download('us-stock-holdings-template.csv','\uFEFFTicker,Quantity,AverageCost,LastPrice,Sector,Currency\r\n','text/csv;charset=utf-8');break;case'add-holding':if(ui.holdings.length<500){ui.holdings.push({ticker:'',quantity:'',cost:'',price:'',sector:''});render(false);}break;case'sample-holdings':ui.holdings=[{ticker:'DEMO-A',quantity:150,cost:80,price:100,sector:'科技（虚构）'},{ticker:'DEMO-B',quantity:50,cost:120,price:110,sector:'科技（虚构）'},{ticker:'DEMO-C',quantity:80,cost:50,price:65,sector:'医疗（虚构）'}];render(false);analyzeHoldings();toast('这是虚构示例，不是真实证券持仓。');break;case'clear-holdings':ui.holdings=[];render(false);break;case'analyze-holdings':analyzeHoldings();break;case'cancel-note-edit':ui.noteEdit=null;render(false);break;case'export-notes':download('options-learning-backup.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),...saved},null,2),'application/json;charset=utf-8');toast('已导出进度与手记，不含持仓工作台数据。');break;}});
$('#menu-button').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#nav-backdrop').hidden=!open;$('#menu-button').setAttribute('aria-expanded',String(open));});$('#nav-backdrop').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});$('#print-button').addEventListener('click',()=>window.print());window.addEventListener('hashchange',()=>render());render(false);
</script>
